version: 2

updates:
  # ── NestJS / npm (monorepo root) ──────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
        update-types:
          - minor
          - patch
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - minor
          - patch
    ignore:
      # Major NestJS upgrades require manual review
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore"
      include: scope

  # ── NestJS API app ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore"
      include: scope

  # ── Next.js web app ───────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore"
      include: scope

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: scope
