name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Turbo pipeline gate ───────────────────────────────────────────────────
  # This job is the single required status check that branch-protection rules
  # gate on.  It fans out build → lint → test across all JS/TS packages in
  # dependency order via Turbo's remote-cache-aware task graph.  The Rust
  # contract jobs remain separate because Turbo cannot orchestrate cargo.
  turbo-pipeline:
    name: Turbo pipeline (build / lint / test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swyft
        options: >-
          --health-cmd "pg_isready -U postgres -d swyft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swyft
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      STELLAR_RPC_URL: ${{ secrets.STELLAR_RPC_URL || 'https://soroban-testnet.stellar.org' }}
      HORIZON_URL: ${{ secrets.HORIZON_URL || 'https://horizon-testnet.stellar.org' }}
      STELLAR_NETWORK: testnet
      # Turbo remote cache (optional — falls back to local cache when unset)
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      # Run the full build → lint → test graph in dependency order.
      # --filter excludes the Rust contract package (handled by `contracts` job).
      # --concurrency=4 caps parallelism to stay within GitHub-hosted runner
      # memory limits.
      - name: Turbo build
        run: pnpm turbo run build --filter=!contracts --concurrency=4

      - name: Turbo lint
        run: pnpm turbo run lint --filter=!contracts --concurrency=4

      - name: Turbo test
        run: pnpm turbo run test --filter=!contracts --concurrency=4

  # ── Prettier / ESLint required on apps (#1079) ───────────────────────────
  # Fail-closed formatting + lint gate for the apps workspace.  Prettier runs
  # in --check mode (never --write) so drift must be fixed in the PR; ESLint
  # runs against apps/api using apps/api/eslint.config.mjs.  This job is a
  # required status check — contributors cannot bypass it locally because the
  # same commands are wired into .husky/pre-commit and .husky/pre-push.
  lint-format:
    name: Lint + format (apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prettier config source of truth: root .prettierrc (+ .prettierignore).
      # --check fails the job on any formatting violation (fail-closed).
      - name: Prettier check (apps)
        run: pnpm exec prettier --check "apps/**/*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml}"

      # ESLint config source of truth: apps/api/eslint.config.mjs.
      - name: ESLint (apps/api)
        run: pnpm --filter api lint

  # ── Per-package jobs (kept for targeted PR feedback) ─────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: [turbo-pipeline]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Test
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: [turbo-pipeline]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swyft
        options: >-
          --health-cmd "pg_isready -U postgres -d swyft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swyft
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      STELLAR_RPC_URL: ${{ secrets.STELLAR_RPC_URL || 'https://soroban-testnet.stellar.org' }}
      HORIZON_URL: ${{ secrets.HORIZON_URL || 'https://horizon-testnet.stellar.org' }}
      STELLAR_NETWORK: testnet

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm --filter api lint

      - name: Unit tests
        run: pnpm --filter api test

      - name: E2E tests
        run: pnpm --filter api test:e2e

      - name: Build
        run: pnpm --filter api build

  # Required status check (#1029): boots the full AppModule graph with every
  # external dependency stubbed and asserts core routes + deny-by-default on
  # privileged routes. No DB/Redis services on purpose — the suite must not
  # depend on them. Keep the job `name` stable: branch protection keys on it.
  # See docs/APP_SMOKE.md.
  api-smoke:
    name: API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-smoke-secret
      STELLAR_NETWORK: testnet
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: App smoke spec
        run: pnpm --filter api test:smoke

  sdk:
    name: SDK
    runs-on: ubuntu-latest
    needs: [turbo-pipeline]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @swyft/sdk build:check

      - name: Test
        run: pnpm --filter @swyft/sdk test

      - name: Build
        run: pnpm --filter @swyft/sdk build

      - name: Check bundle size budget
        run: pnpm --filter @swyft/sdk size:check

  ui:
    name: UI
    runs-on: ubuntu-latest
    needs: [turbo-pipeline]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @swyft/ui test

  shared-config-fixtures:
    name: Shared config + fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail-closed: --write refuses under CI, so drift must be fixed in the PR.
      - name: Fixtures deterministic + in sync (#1037)
        env:
          FIXTURE_CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-fixtures
        run: pnpm --filter @swyft/shared-config test:fixtures
