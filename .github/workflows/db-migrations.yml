name: Database Migrations

# Runs automatically on every push/PR that touches the Prisma schema or
# migration files, and can also be triggered manually. This is the CI
# migration smoke referenced in README.md — it must stay green on main and
# on any PR that modifies prisma/**.
on:
  push:
    branches: [main]
    paths:
      - "prisma/**"
  pull_request:
    branches: [main]
    paths:
      - "prisma/**"
  workflow_dispatch:

jobs:
  db-migrations:
    name: db-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swyft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swyft_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swyft_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: pnpm prisma generate --schema prisma/schema.prisma

      - name: Run migrate deploy
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swyft_test?schema=public

      - name: Verify migration status
        run: pnpm prisma migrate status --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swyft_test?schema=public

      - name: Run seed (idempotency smoke)
        # Runs the seed against the freshly migrated DB to confirm the seed
        # script itself stays in sync with the schema. Safe to re-run — every
        # record uses upsert.
        run: pnpm --filter api exec ts-node ../../prisma/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swyft_test?schema=public
